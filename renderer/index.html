<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Emotion Ball Pet</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <!-- 提示气泡：AI 消息里的 tips 字段落在这里 -->
  <div id="bubble" class="bubble" aria-live="polite"></div>

  <!-- 球体容器：引擎会把 SVG 挂进来 -->
  <div id="pet" class="pet"></div>

  <!-- 引擎四件套，顺序不能变：数据 → 配置 → 渲染 → 驱动 -->
  <script src="../vendor/emotion-ball/rings.js"></script>
  <script src="../vendor/emotion-ball/emotions.js"></script>
  <script src="../vendor/emotion-ball/ball.js"></script>
  <script src="../vendor/emotion-ball/engine.js"></script>
  <script src="pet.js"></script>
</body>
</html>
